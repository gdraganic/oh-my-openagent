name: Fork sync (main)
# Default branch of this fork: schedules only run from here.

# Keeps this fork's `main` branch (the OpenCode V2 line) current with upstream `dev`
# (code-yeongyu/oh-my-openagent). `main` is rebuilt as upstream `dev` + every commit
# carrying the trailer `Fork-Patch: v2-support`, which includes the OpenCode V2 port
# from upstream PR #9016. Rebasing on the PR head instead would pin the fork to the
# upstream commit that PR was opened against and drop every later upstream fix.
# A conflict or a failing V2 test leaves the branch untouched and opens (or updates) an issue.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM: code-yeongyu/oh-my-openagent
  BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch sources
        id: sources
        run: |
          git config user.name "fork-sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream dev
          echo "base=upstream/dev" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse upstream/dev)" >> "$GITHUB_OUTPUT"

      - name: Rebuild main
        id: rebuild
        run: |
          patches=$(git log --reverse --format=%H --grep='^Fork-Patch: v2-support' "origin/${BRANCH}")
          git checkout -q -B candidate "${{ steps.sources.outputs.base }}"
          for sha in $patches; do
            subject=$(git log -1 --format=%s "$sha")
            if git merge-base --is-ancestor "$sha" HEAD; then continue; fi
            if ! git cherry-pick -x "$sha" >/dev/null 2>&1; then
              git cherry-pick --abort || true
              echo "conflict=$subject" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # Upstream's own workflows (CI, publish, cron jobs) must never run in this
          # fork; the branch carries only the fork's sync and release workflows.
          find .github/workflows -type f ! -name 'fork-sync.yml' ! -name 'fork-release.yml' -print0 | xargs -0 -r git rm -q
          git diff --cached --quiet || git commit -q -m "ci(fork): drop upstream workflows from the fork branch"
          if [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "origin/${BRANCH}^{tree}")" ]; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.rebuild.outputs.conflict == '' && steps.rebuild.outputs.unchanged != 'true'

      - name: Test the V2 adapter
        id: test
        if: steps.rebuild.outputs.conflict == '' && steps.rebuild.outputs.unchanged != 'true'
        continue-on-error: true
        run: |
          bun install --frozen-lockfile || bun install
          bun test packages/omo-opencode/src/v2 packages/omo-config-core/src/loader \
            packages/omo-opencode/src/shared/prompt-async-route-audit.test.ts \
            packages/omo-opencode/src/shared/opencode-adapter-bun-runtime-audit.test.ts

      - name: Push
        if: steps.rebuild.outputs.conflict == '' && steps.rebuild.outputs.unchanged != 'true' && steps.test.outcome == 'success'
        run: git push --force-with-lease="${BRANCH}:origin/${BRANCH}" origin "candidate:${BRANCH}"

      - name: Report failure
        if: steps.rebuild.outputs.conflict != '' || steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT: ${{ steps.rebuild.outputs.conflict }}
          BASE: ${{ steps.sources.outputs.base }}
          BASE_SHA: ${{ steps.sources.outputs.base_sha }}
        run: |
          title="fork-sync: main needs attention"
          if [ -n "$CONFLICT" ]; then reason="Cherry-pick conflict on: $CONFLICT"; else reason="V2 adapter tests failed after rebase"; fi
          body="$reason

          Base: \`$BASE\` @ \`$BASE_SHA\`
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          \`${BRANCH}\` was left unchanged."
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "$body"; else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
          exit 1
